spring.application.name=ai4-admin-backend
server.servlet.context-path=/ai/v4
spring.datasource.url=${AI4_DB_URL:jdbc:mysql://localhost:3306/ai4_boot_verify?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${AI4_DB_USERNAME:root}
spring.datasource.password=${AI4_DB_PASSWORD}
ai4.jwt.secret=${AI4_JWT_SECRET}
ai4.jwt.expire-seconds=${AI4_JWT_EXPIRE_SECONDS:28800}
ai4.id.worker-id=${AI4_SNOWFLAKE_WORKER_ID:1}

# 录制页面跨域来源，多个来源用逗号分隔；测试服和正式服分别配置各自的前端域名
ai4.cors.allowed-origins=${AI4_CORS_ALLOWED_ORIGINS:}

# 本地图形验证码
ai4.auth.captcha.enabled=${AI4_AUTH_CAPTCHA_ENABLED:true}
ai4.auth.captcha.expire-seconds=${AI4_AUTH_CAPTCHA_EXPIRE_SECONDS:120}

# 客户端用户服务内部接口
ai4.client-user.base-url=${AI4_CLIENT_USER_BASE_URL:http://127.0.0.1:8081}
ai4.client-user.internal-token=${AI4_CLIENT_USER_INTERNAL_TOKEN:}
ai4.client-user.connect-timeout-seconds=${AI4_CLIENT_USER_CONNECT_TIMEOUT_SECONDS:5}
ai4.client-user.read-timeout-seconds=${AI4_CLIENT_USER_READ_TIMEOUT_SECONDS:15}

spring.flyway.enabled=false

spring.flyway.baseline-on-migrate=false

spring.flyway.validate-on-migrate=false

# OSS
ai4.oss.endpoint=${AI4_OSS_ENDPOINT:}
ai4.oss.bucket-name=${AI4_OSS_BUCKET_NAME:}
ai4.oss.access-key-id=${AI4_OSS_ACCESS_KEY_ID:}
ai4.oss.access-key-secret=${AI4_OSS_ACCESS_KEY_SECRET:}
ai4.oss.public-base-url=${AI4_OSS_PUBLIC_BASE_URL:}


spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

ai4.ark.base-url=${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

ai4.ark.api-key=${ARK_API_KEY:}

ai4.ark.model=${ARK_MODEL:doubao-seed-2-1-pro-260628}

ai4.ark.timeout-seconds=${ARK_TIMEOUT_SECONDS:80}

# Coze OAuth JWT
ai4.coze.enabled=${COZE_ENABLED:true}
ai4.coze.base-url=${COZE_BASE_URL:https://api.coze.cn}
ai4.coze.oauth-config-path=${COZE_OAUTH_CONFIG_PATH:}
ai4.coze.timeout-seconds=${COZE_TIMEOUT_SECONDS:90}
ai4.coze.workflows.question-before-guide-id=${COZE_QUESTION_BEFORE_GUIDE_WORKFLOW_ID:}
ai4.coze.workflows.question-after-guide-id=${COZE_QUESTION_AFTER_GUIDE_WORKFLOW_ID:}

# Redis
spring.data.redis.host=${AI4_REDIS_HOST:}
spring.data.redis.port=${AI4_REDIS_PORT:}
spring.data.redis.database=${AI4_REDIS_DATABASE:11}
spring.data.redis.password=${AI4_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s

# CRM 外部接口 IP 白名单
ai4.external.crm.ip-whitelist-key=${AI4_CRM_IP_WHITELIST_KEY:ai4:external:crm:ip-whitelist}
ai4.external.crm.trusted-proxy-ips=${AI4_CRM_TRUSTED_PROXY_IPS:127.0.0.1,::1}

# CRM 出站同步接口
ai4.external.crm.callback.enabled=${AI4_CRM_CALLBACK_ENABLED:}
ai4.external.crm.callback.base-url=${AI4_CRM_CALLBACK_BASE_URL:}
ai4.external.crm.callback.course-package-live-count-path=${AI4_CRM_COURSE_PACKAGE_LIVE_COUNT_PATH:/api/aiv2/apicoursepackage/updateLiveLessonCountBypackageId}
ai4.external.crm.callback.class-end-callback-path=${AI4_CRM_CLASS_END_CALLBACK_PATH:/api/aiv2/liveclass/classendcalback}
ai4.external.crm.callback.connect-timeout-seconds=${AI4_CRM_CALLBACK_CONNECT_TIMEOUT_SECONDS:5}
ai4.external.crm.callback.read-timeout-seconds=${AI4_CRM_CALLBACK_READ_TIMEOUT_SECONDS:15}
ai4.external.crm.callback.retry-scan-delay-ms=${AI4_CRM_CALLBACK_RETRY_SCAN_DELAY_MS:60000}
ai4.external.crm.callback.retry-history-days=${AI4_CRM_CALLBACK_RETRY_HISTORY_DAYS:7}

# Agora
ai4.agora.enabled=${AI4_AGORA_ENABLED:true}
ai4.agora.app-id=${AI4_AGORA_APP_ID:}
ai4.agora.app-certificate=${AI4_AGORA_APP_CERTIFICATE:}
ai4.agora.rest-api-key=${AI4_AGORA_REST_API_KEY:}
ai4.agora.rest-api-secret=${AI4_AGORA_REST_API_SECRET:}
ai4.agora.classroom-base-url=${AI4_AGORA_CLASSROOM_BASE_URL:https://api.sd-rtn.com}
ai4.agora.cloud-recording-base-url=${AI4_AGORA_CLOUD_RECORDING_BASE_URL:https://api.agora.io}
ai4.agora.record-page-url=${AI4_AGORA_RECORD_PAGE_URL:}
ai4.agora.recording-storage-region=${AI4_AGORA_RECORDING_STORAGE_REGION:3}
ai4.agora.connect-timeout-seconds=${AI4_AGORA_CONNECT_TIMEOUT_SECONDS:5}
ai4.agora.read-timeout-seconds=${AI4_AGORA_READ_TIMEOUT_SECONDS:15}
ai4.agora.room-provision-delay-ms=${AI4_AGORA_ROOM_PROVISION_DELAY_MS:3000}
ai4.agora.event-sync-delay-ms=${AI4_AGORA_EVENT_SYNC_DELAY_MS:5000}
ai4.agora.recording-recovery-delay-ms=${AI4_AGORA_RECORDING_RECOVERY_DELAY_MS:30000}

# 声网定时任务线程池
spring.task.scheduling.pool.size=${AI4_SCHEDULING_POOL_SIZE:3}
spring.task.scheduling.thread-name-prefix=ai4-scheduling-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s
